name: Release Build

on: workflow_dispatch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build Mod
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload Compiled JAR (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: meteor-litematica-printer-26.3-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Version 1.5.0 for Minecraft 26.3"
          tag_name: "1.5.0-26.3"
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          make_latest: true
